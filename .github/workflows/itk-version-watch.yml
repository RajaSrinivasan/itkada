name: ITK version watch

# Non-blocking look at the version-bump policy: newest non-prerelease ITK
# tag versus the distro insighttoolkit package. It does not change the
# 5.4.8 pin used by the main workflow.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  watch:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Compare ITK tag and apt with the pin
        run: |
          pin=$(sed -n 's/^VERSION="\${ITK_VERSION:-\(.*\)}".*/\1/p' tools/build_itk.sh)
          echo "pinned version: ${pin}"
          tag=$(curl -fsSL https://api.github.com/repos/InsightSoftwareConsortium/ITK/releases?per_page=30 \
            | python3 -c 'import json,sys,re
          rels=json.load(sys.stdin)
          for rel in rels:
              if rel.get("prerelease"):
                  continue
              name=rel.get("tag_name","")
              if re.fullmatch(r"v[0-9]+(\.[0-9]+)+", name):
                  print(name)
                  break
          ')
          echo "newest stable tag: ${tag:-unknown}"
          apt-cache policy libinsighttoolkit5-dev || true
          apt_ver=$(apt-cache policy libinsighttoolkit5-dev 2>/dev/null | awk '/Candidate:/ {print $2; exit}')
          echo "apt candidate: ${apt_ver:-none}"
          python3 - "$pin" "${tag#v}" "${apt_ver:-0}" << 'PY'
          import sys
          def parse(text):
              nums = []
              for part in text.replace(":", ".").split("."):
                  digits = "".join(ch for ch in part if ch.isdigit())
                  if digits:
                      nums.append(int(digits))
                  else:
                      break
              return tuple(nums)
          pin, tag, apt = (parse(sys.argv[i]) for i in range(1, 4))
          newer = []
          if tag > pin:
              newer.append(f"git tag {tag} is newer than pin {pin}")
          if apt > pin and apt != (0,):
              newer.append(f"apt {apt} is newer than pin {pin}")
          if newer:
              print("ITK pin is behind:")
              print("\n".join(newer))
              sys.exit(1)
          print("pin matches the newest public ITK this job can see")
          PY

  beta:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Report the newest ITK prerelease
        run: |
          python3 - << 'PY'
          import json, re, urllib.request
          rels = json.load(urllib.request.urlopen(
              "https://api.github.com/repos/InsightSoftwareConsortium/ITK/releases?per_page=30"))
          beta = next((rel.get("tag_name") for rel in rels if rel.get("prerelease")), None)
          print(f"newest prerelease: {beta or 'none'}")
          print("The shim targets ITK 5. A 6.0 prerelease stays off the blocking build.")
          PY
